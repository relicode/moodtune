services:
  moodtune-app:
    image: node:24-alpine
    restart: unless-stopped
    profiles: [app]
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - UPLOAD_TMP_DIR=/tmp/uploads
      - LOG_DIR=/var/log/moodtune
    ports:
      - '127.0.0.1:3000:3000'
    expose:
      - 3000
    working_dir: /app
    volumes:
      - ./.next/standalone:/app
      - ./.next/static:/app/.next/static
      - ./public:/app/public
      - ./data/uploads:/tmp/uploads
      - ./data/log:/var/log/moodtune
    command: node server.js

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    expose:
      - 6379
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    expose:
      - 9000
      - 9001
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
