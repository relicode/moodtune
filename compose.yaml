name: moodtune

# Moodtune services
#
# All services are bound to 127.0.0.1 only.
# Required env vars (JWT_SECRET, MINIO_ACCESS_KEY, MINIO_SECRET_KEY) are
# validated at startup via ${VAR:?} — compose will fail with a clear error
# if any are missing from .env.
#
# Production: ./prod.sh up -d
# Dev infra:  docker compose up redis minio  (run app on host with npm run dev)

services:
  moodtune-app:
    build: .
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      LOG_DIR: ${LOG_DIR:-/var/log/moodtune}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-moodtune}
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      REDIS_URL: redis://redis:6379
      UPLOAD_TMP_DIR: ${UPLOAD_TMP_DIR:-/var/tmp}
    ports:
      - '127.0.0.1:${APP_PORT:-3333}:3000'
    volumes:
      - ./data/uploads:/var/tmp
      - ./data/log:/var/log/moodtune
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - caddy
      - default
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  caddy:
    name: caddy
