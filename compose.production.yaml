# Production overlay — included by ~/services/compose.yaml or used standalone via ./prod.sh
#
# All services are bound to 127.0.0.1 only.
# JWT_SECRET must be set in .env; prod.sh validates this before starting.

services:
  moodtune-app:
    profiles: !override []
    user: '1001:100'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          memory: 512M
    ports: !override
      - '127.0.0.1:3333:3000'
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    networks:
      - caddy
      - default
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    ports: !override
      - '127.0.0.1:9000:9000'
    command: server /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  caddy:
    name: caddy
