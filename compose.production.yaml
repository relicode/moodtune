# Production overlay — apply with: ./prod.sh up -d
#
# Security notes:
# - Redis password is passed via --requirepass command arg, which is visible in
#   docker inspect and /proc/<pid>/cmdline. This is a Redis limitation. Mitigated
#   by running Redis on an internal network with no host port binding.
# - REDIS_PASSWORD must be set in .env; prod.sh validates this before starting.

services:
  app:
    user: '1001:100'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          memory: 512M
    ports: !override
      - '127.0.0.1:3333:3000'
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - frontend
      - backend
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    ports: !override []
    expose: !override
      - 6379
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --protected-mode
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
      - --rename-command
      - FLUSHALL
      - ''
      - --rename-command
      - FLUSHDB
      - ''
      - --rename-command
      - DEBUG
      - ''
      - --rename-command
      - CONFIG
      - ''
      - --rename-command
      - KEYS
      - ''
      - --rename-command
      - SHUTDOWN
      - ''

  minio:
    ports: !override []
    expose: !override
      - 9000
    command: server /data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
